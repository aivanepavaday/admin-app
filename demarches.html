<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Démarches — Admin</title>
  <link rel="stylesheet" href="demarches.css" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="app">

    <!-- ── Header ── -->
    <header class="header">
      <a href="index.html" class="logo">⬡ Admin</a>
      <nav class="nav">
        <a href="index.html"        class="nav-link">Accueil</a>
        <a href="index.html#docs"    class="nav-link">Documents</a>
        <a href="demarches.html"    class="nav-link active">Démarches</a>
        <a href="medical.html"      class="nav-link">Santé</a>
        <a href="surveillance.html" class="nav-link">Surveillance Gmail</a>
        <a href="parametres.html"   class="nav-link">Paramètres</a>
      </nav>
      <div id="nav-user-profile"></div>
      <span class="sync-dot sync-ok" title="Synchronisé"></span>
      <a href="parametres.html" class="header-settings-btn" title="Paramètres" aria-label="Paramètres">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </a>
    </header>

    <!-- ── Démarches ── -->
    <div class="view">

      <div class="list-top">
        <h1 class="view-heading">Démarches</h1>
        <p class="view-desc">Vérifiez vos documents et suivez vos démarches pas à pas</p>
      </div>

      <!-- Barre de recherche -->
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Rechercher une démarche…"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="search-clear" class="search-clear hidden" title="Effacer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Grille de cartes -->
      <div id="demarche-grid" class="demarche-grid">
        <div class="loading-placeholder">
          <div class="spinner"></div>
          <span>Chargement…</span>
        </div>
      </div>

      <!-- État vide (recherche sans résultats) -->
      <div id="empty-search" class="empty-search hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>Aucune démarche trouvée</p>
        <span id="empty-query"></span>
      </div>

    </div>

  </div><!-- /.app -->

  <div id="toast" class="toast hidden"></div>

  <!-- ── Visionneuse de document ── -->
  <div id="viewer-modal" class="viewer-modal hidden" role="dialog" aria-modal="true">
    <div class="viewer-box">
      <div class="viewer-header">
        <span id="viewer-name" class="viewer-name"></span>
        <button id="viewer-close" class="viewer-close" title="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="viewer-content" class="viewer-content"></div>
    </div>
  </div>

  <!-- ── Bottom Nav (mobile uniquement) ── -->
  <nav class="bottom-nav" aria-label="Navigation principale">

    <a class="bnav-tab" href="index.html" aria-label="Accueil">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </span>
      <span class="bnav-label">Accueil</span>
    </a>

    <a class="bnav-tab" href="index.html#docs" aria-label="Documents">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </span>
      <span class="bnav-label">Documents</span>
    </a>

    <a class="bnav-tab active" href="demarches.html" aria-label="Démarches">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
      </span>
      <span class="bnav-label">Démarches</span>
    </a>

    <span class="bnav-tab bnav-disabled" aria-label="Calendrier (bientôt disponible)" aria-disabled="true">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </span>
      <span class="bnav-label">Calendrier</span>
    </span>

    <a class="bnav-tab" href="surveillance.html" aria-label="Gmail">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </span>
      <span class="bnav-label">Gmail</span>
    </a>

  </nav>

  <script type="module" src="demarches.js"></script>
</body>
</html>
